<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪輯師任務看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 進度狀態顏色 */
        .status-script { background-color: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }
        .status-edit { background-color: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
        .status-done { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        
        .loader {
            border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3b82f6;
            width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .tab-active { border-bottom: 2px solid #3b82f6; color: #2563eb; font-weight: 700; }
        .tab-inactive { color: #6b7280; }

        .status-row-script { background-color: #f0f4ff; }
        .status-row-edit { background-color: #fff7ed; }
        .status-row-done { background-color: #f0fdf4; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-gray-500 text-sm font-medium">資料同步中...</p>
    </div>

    <!-- 門禁畫面 (Access Gate) -->
    <div id="access-gate" class="fixed inset-0 bg-gray-50 z-50 flex flex-col items-center justify-center hidden">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border border-gray-100">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-lock text-blue-600 text-2xl"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">管理員登入</h2>
            <p class="text-gray-500 text-sm mb-8 leading-relaxed">
                請輸入管理員通行碼<br>
                以進入剪輯師任務看板
            </p>
            
            <div class="border-t border-gray-100 pt-6">
                <div id="admin-input-area" class="animate-fade-in">
                    <div class="flex items-center gap-2">
                        <input type="password" id="admin-pass" placeholder="請輸入通行碼" class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                        <button onclick="submitAdminLogin()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                    <p id="login-error" class="text-red-500 text-xs mt-2 hidden">通行碼錯誤，請重試</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 頂部導航 -->
    <div id="main-nav" class="fixed top-0 left-0 right-0 bg-white shadow-sm z-50 hidden">
        <div class="max-w-4xl mx-auto px-4 pt-4">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold text-gray-900 tracking-tight flex items-center">
                    <i class="fa-solid fa-video text-blue-600 mr-2"></i>
                    剪輯師任務看板
                </h1>
                <span id="status-badge" class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded-full flex items-center">
                    <span class="w-2 h-2 rounded-full bg-gray-400 mr-1"></span> 讀取中
                </span>
            </div>

            <!-- 篩選器 -->
            <div class="flex items-center gap-3 pb-3 mb-2 overflow-x-auto hide-scrollbar">
                <span class="text-xs font-bold text-gray-400 whitespace-nowrap"><i class="fa-solid fa-filter mr-1"></i>篩選:</span>
                
                <select id="filter-status" onchange="applyFilters()" class="appearance-none bg-gray-100 text-gray-700 text-sm border border-gray-200 rounded-lg px-3 py-1.5 pr-8 focus:outline-none focus:bg-white focus:border-blue-500 cursor-pointer font-medium transition-colors">
                    <option value="">全部進度</option>
                    <option value="腳本中">腳本中</option>
                    <option value="剪輯中">剪輯中</option>
                    <option value="已完成">已完成</option>
                </select>

                <select id="filter-editor" onchange="applyFilters()" class="appearance-none bg-gray-100 text-gray-700 text-sm border border-gray-200 rounded-lg px-3 py-1.5 pr-8 focus:outline-none focus:bg-white focus:border-blue-500 cursor-pointer font-medium transition-colors">
                    <option value="">全部剪輯師</option>
                </select>

                <select id="filter-client" onchange="applyFilters()" class="appearance-none bg-gray-100 text-gray-700 text-sm border border-gray-200 rounded-lg px-3 py-1.5 pr-8 focus:outline-none focus:bg-white focus:border-blue-500 cursor-pointer font-medium transition-colors">
                    <option value="">全部客戶</option>
                </select>

                <input type="text" id="filter-search" placeholder="搜尋主題..." onchange="applyFilters()" oninput="applyFilters()" class="flex-1 min-w-[150px] bg-gray-100 text-gray-700 text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:bg-white focus:border-blue-500 transition-colors">
            </div>

            <!-- 統計資訊 -->
            <div class="flex gap-4 text-xs pb-3 border-b border-gray-200">
                <div class="flex items-center">
                    <span class="font-bold text-gray-800 mr-1" id="total-count">0</span>
                    <span class="text-gray-500">個任務</span>
                </div>
                <div class="flex items-center">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 mr-1"></span>
                    <span class="font-bold text-gray-800 mr-1" id="script-count">0</span>
                    <span class="text-gray-500">腳本中</span>
                </div>
                <div class="flex items-center">
                    <span class="w-2 h-2 rounded-full bg-orange-400 mr-1"></span>
                    <span class="font-bold text-gray-800 mr-1" id="edit-count">0</span>
                    <span class="text-gray-500">剪輯中</span>
                </div>
                <div class="flex items-center">
                    <span class="w-2 h-2 rounded-full bg-green-400 mr-1"></span>
                    <span class="font-bold text-gray-800 mr-1" id="done-count">0</span>
                    <span class="text-gray-500">已完成</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="max-w-4xl mx-auto px-4 mt-32 pb-8">
        <div id="table-container" class="hidden">
            <div class="overflow-x-auto rounded-lg shadow-sm">
                <table class="w-full bg-white border-collapse">
                    <thead class="bg-gray-100 sticky top-32 z-10">
                        <tr class="border-b-2 border-gray-200">
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider whitespace-nowrap">影片編號</th>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">主題</th>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider whitespace-nowrap">狀態</th>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider whitespace-nowrap">客戶</th>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider whitespace-nowrap">剪輯師</th>
                            <th class="px-4 py-3 text-center text-xs font-bold text-gray-600 uppercase tracking-wider whitespace-nowrap">操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="empty-state" class="hidden text-center mt-20 px-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">
                <i class="fa-solid fa-inbox text-gray-400 text-2xl"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900">沒有找到任務</h3>
            <p class="text-gray-500 mt-2">調整篩選條件或稍後再試</p>
        </div>
    </div>

    <!-- 詳情模態框 -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-900" id="modal-title"></h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-content" class="px-6 py-6"></div>
            <div class="border-t border-gray-200 px-6 py-4 flex gap-3">
                <button onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg transition">
                    關閉
                </button>
                <button id="modal-edit-btn" onclick="openEditModal()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
                    編輯
                </button>
            </div>
        </div>
    </div>

    <!-- 編輯模態框 -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-900">編輯任務</h2>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="edit-form" class="px-6 py-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">影片編號</label>
                    <input type="text" id="edit-videoId" readonly class="w-full bg-gray-100 border border-gray-300 text-gray-700 text-sm rounded-lg px-3 py-2 cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">進度狀態 *</label>
                    <select id="edit-status" class="w-full bg-white border border-gray-300 text-gray-700 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                        <option value="">選擇狀態</option>
                        <option value="腳本中">腳本中</option>
                        <option value="剪輯中">剪輯中</option>
                        <option value="已完成">已完成</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">剪輯備註</label>
                    <textarea id="edit-notes" rows="4" placeholder="輸入編輯過程中的備註..." class="w-full bg-white border border-gray-300 text-gray-700 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">完成檔案連結</label>
                    <input type="url" id="edit-finalLink" placeholder="貼上完成檔案的連結..." class="w-full bg-white border border-gray-300 text-gray-700 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                </div>

                <div class="border-t border-gray-200 pt-4 flex gap-3">
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg transition">
                        取消
                    </button>
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition">
                        保存更新
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="fixed top-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-[60]"></div>

    <script>
        // ==========================================
        // 配置
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbzE27H5N1FWVdv7jyP4-hWTUicbtLxNnHog7U_9pm-yW7nUoDhHD633xxTeTY07HrGv/exec";
        const ADMIN_PASSWORD = "8888";

        let allTasks = [];
        let filteredTasks = [];
        let currentEditTask = null;
        let isAdminMode = false;

        // ==========================================
        // 初始化
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const modeParam = urlParams.get('mode');

            if (modeParam === 'admin') {
                await loadData();
                showAdminUI();
                isAdminMode = true;
            } else {
                // 顯示門禁畫面
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('access-gate').classList.remove('hidden');
            }
        });

        // ==========================================
        // 資料載入
        // ==========================================
        async function loadData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response');
                allTasks = await response.json() || [];
                
                if (!Array.isArray(allTasks)) {
                    allTasks = [];
                }

                populateFilters();
                applyFilters();
                updateStatus(true);
            } catch (error) {
                console.error('載入失敗:', error);
                useFallbackData();
                updateStatus(false);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        function useFallbackData() {
            allTasks = [
                {
                    rowIndex: 2,
                    videoId: "VID-001",
                    title: "請確認 API 連接",
                    field: "示範",
                    topic: "Google Apps Script 連接",
                    status: "腳本中",
                    client: "示範客戶",
                    editor: "演示編輯",
                    outline: "請檢查 Google Apps Script 部署權限",
                    notes: "確認 SPREADSHEET_ID 正確",
                    keyPoints: "測試資料"
                }
            ];
        }

        function populateFilters() {
            const editors = [...new Set(allTasks.map(t => t.editor).filter(e => e))].sort();
            const clients = [...new Set(allTasks.map(t => t.client).filter(c => c))].sort();

            const editorSelect = document.getElementById('filter-editor');
            const clientSelect = document.getElementById('filter-client');

            editorSelect.innerHTML = '<option value="">全部剪輯師</option>';
            clientSelect.innerHTML = '<option value="">全部客戶</option>';

            editors.forEach(editor => {
                const opt = document.createElement('option');
                opt.value = editor;
                opt.textContent = editor;
                editorSelect.appendChild(opt);
            });

            clients.forEach(client => {
                const opt = document.createElement('option');
                opt.value = client;
                opt.textContent = client;
                clientSelect.appendChild(opt);
            });
        }

        // ==========================================
        // 篩選和顯示
        // ==========================================
        function applyFilters() {
            const statusFilter = document.getElementById('filter-status').value;
            const editorFilter = document.getElementById('filter-editor').value;
            const clientFilter = document.getElementById('filter-client').value;
            const searchFilter = document.getElementById('filter-search').value.toLowerCase();

            filteredTasks = allTasks.filter(task => {
                const matchStatus = !statusFilter || task.status === statusFilter;
                const matchEditor = !editorFilter || task.editor === editorFilter;
                const matchClient = !clientFilter || task.client === clientFilter;
                const matchSearch = !searchFilter || 
                    (task.topic && task.topic.toLowerCase().includes(searchFilter)) ||
                    (task.videoId && task.videoId.toLowerCase().includes(searchFilter));

                return matchStatus && matchEditor && matchClient && matchSearch;
            });

            renderTable();
            updateStats();
        }

        function renderTable() {
            const tableContainer = document.getElementById('table-container');
            const tableBody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');

            tableBody.innerHTML = '';

            if (filteredTasks.length === 0) {
                tableContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            tableContainer.classList.remove('hidden');
            emptyState.classList.add('hidden');

            filteredTasks.forEach((task, idx) => {
                const statusClass = {
                    '腳本中': 'status-script',
                    '剪輯中': 'status-edit',
                    '已完成': 'status-done'
                }[task.status] || 'bg-gray-100 text-gray-600';

                const rowClass = {
                    '腳本中': 'status-row-script',
                    '剪輯中': 'status-row-edit',
                    '已完成': 'status-row-done'
                }[task.status] || '';

                const row = document.createElement('tr');
                row.className = `border-b border-gray-200 hover:${rowClass} transition-colors ${rowClass}`;
                row.innerHTML = `
                    <td class="px-4 py-3 text-sm font-bold text-gray-800 whitespace-nowrap">${escapeHtml(task.videoId)}</td>
                    <td class="px-4 py-3 text-sm text-gray-700">
                        <div class="font-medium">${escapeHtml(task.topic || '無主題')}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(task.field || '')}</div>
                    </td>
                    <td class="px-4 py-3 text-sm">
                        <span class="inline-block px-2 py-1 rounded text-xs font-bold ${statusClass}">
                            ${escapeHtml(task.status || '未分配')}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-700 whitespace-nowrap">${escapeHtml(task.client || '-')}</td>
                    <td class="px-4 py-3 text-sm text-gray-700 whitespace-nowrap">${escapeHtml(task.editor || '-')}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="showDetailModal(${idx})" class="inline-flex items-center justify-center gap-1 bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-bold py-1.5 px-2.5 rounded-lg transition">
                            <i class="fa-solid fa-eye"></i> 查看
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateStats() {
            document.getElementById('total-count').textContent = filteredTasks.length;
            document.getElementById('script-count').textContent = filteredTasks.filter(t => t.status === '腳本中').length;
            document.getElementById('edit-count').textContent = filteredTasks.filter(t => t.status === '剪輯中').length;
            document.getElementById('done-count').textContent = filteredTasks.filter(t => t.status === '已完成').length;
        }

        // ==========================================
        // 模態框
        // ==========================================
        function showDetailModal(idx) {
            const task = filteredTasks[idx];
            if (!task) return;

            currentEditTask = task;

            document.getElementById('modal-title').textContent = task.videoId + ' - ' + (task.topic || '無主題');
            
            const content = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <div class="text-xs font-bold text-gray-400 uppercase mb-1">影片編號</div>
                            <div class="text-sm font-medium text-gray-800">${escapeHtml(task.videoId)}</div>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-gray-400 uppercase mb-1">領域</div>
                            <div class="text-sm font-medium text-gray-800">${escapeHtml(task.field || '-')}</div>
                        </div>
                    </div>

                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase mb-1">主題</div>
                        <div class="text-sm text-gray-800">${escapeHtml(task.topic || '-')}</div>
                    </div>

                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase mb-1">重點說明</div>
                        <div class="text-sm text-gray-800 whitespace-pre-wrap">${escapeHtml(task.keyPoints || '-')}</div>
                    </div>

                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase mb-1">腳本大綱</div>
                        <div class="text-sm text-gray-800 bg-gray-50 p-3 rounded-lg whitespace-pre-wrap">${escapeHtml(task.outline || '（尚無大綱）')}</div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-2 border-t border-gray-200">
                        <div>
                            <div class="text-xs font-bold text-gray-400 uppercase mb-1">客戶</div>
                            <div class="text-sm font-medium text-gray-800">${escapeHtml(task.client || '-')}</div>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-gray-400 uppercase mb-1">剪輯師</div>
                            <div class="text-sm font-medium text-gray-800">${escapeHtml(task.editor || '-')}</div>
                        </div>
                    </div>

                    <div>
                        <div class="text-xs font-bold text-gray-400 uppercase mb-1">進度狀態</div>
                        <span class="inline-block px-3 py-1 rounded-lg text-sm font-bold ${
                            task.status === '腳本中' ? 'status-script' :
                            task.status === '剪輯中' ? 'status-edit' :
                            task.status === '已完成' ? 'status-done' : 'bg-gray-100 text-gray-600'
                        }">
                            ${escapeHtml(task.status || '未分配')}
                        </span>
                    </div>

                    ${task.notes ? `
                        <div>
                            <div class="text-xs font-bold text-gray-400 uppercase mb-1">剪輯備註</div>
                            <div class="text-sm text-gray-800 bg-blue-50 p-3 rounded-lg whitespace-pre-wrap border border-blue-200">${escapeHtml(task.notes)}</div>
                        </div>
                    ` : ''}

                    ${task.finalLink ? `
                        <div>
                            <div class="text-xs font-bold text-gray-400 uppercase mb-1">完成檔案</div>
                            <a href="${escapeHtml(task.finalLink)}" target="_blank" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-700 text-sm font-medium">
                                <i class="fa-solid fa-link"></i> 檢視檔案
                            </a>
                        </div>
                    ` : ''}
                </div>
            `;

            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function openEditModal() {
            if (!currentEditTask) return;

            document.getElementById('edit-videoId').value = currentEditTask.videoId;
            document.getElementById('edit-status').value = currentEditTask.status || '';
            document.getElementById('edit-notes').value = currentEditTask.notes || '';
            document.getElementById('edit-finalLink').value = currentEditTask.finalLink || '';

            document.getElementById('detail-modal').classList.add('hidden');
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        document.getElementById('edit-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentEditTask) return;

            const status = document.getElementById('edit-status').value;
            const notes = document.getElementById('edit-notes').value;
            const finalLink = document.getElementById('edit-finalLink').value;

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '保存中...';

            try {
                const payload = {
                    action: 'updateTask',
                    rowIndex: currentEditTask.rowIndex,
                    updates: { status, notes, finalLink }
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });

                showToast('✅ 任務已更新！', 'bg-green-600');
                closeEditModal();
                
                // 重新載入資料
                setTimeout(() => loadData(), 500);

            } catch (error) {
                console.error(error);
                showToast('❌ 更新失敗，請稍後再試', 'bg-red-600');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });

        // ==========================================
        // 管理員登入
        // ==========================================
        async function submitAdminLogin() {
            const input = document.getElementById('admin-pass');
            const errorMsg = document.getElementById('login-error');
            const pass = input.value;

            if (pass === ADMIN_PASSWORD) {
                errorMsg.classList.add('hidden');
                document.getElementById('access-gate').classList.add('hidden');
                
                document.getElementById('loading-overlay').style.display = 'flex';
                await loadData();
                showAdminUI();
                isAdminMode = true;
            } else {
                errorMsg.classList.remove('hidden');
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('admin-pass')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitAdminLogin();
        });

        function showAdminUI() {
            document.getElementById('main-nav').classList.remove('hidden');
        }

        // ==========================================
        // 工具函數
        // ==========================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStatus(isOnline) {
            const badge = document.getElementById('status-badge');
            if (isOnline) {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 mr-1"></span> 已連線`;
                badge.className = 'text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full flex items-center border border-green-200';
            } else {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-orange-400 mr-1"></span> 演示模式`;
                badge.className = 'text-xs bg-orange-50 text-orange-700 px-2 py-1 rounded-full flex items-center border border-orange-200';
            }
        }

        function showToast(message, bgClass = 'bg-gray-800') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed top-4 right-4 ${bgClass} text-white px-6 py-3 rounded-lg shadow-xl transition-opacity duration-300 z-[60]`;
            toast.classList.remove('opacity-0', 'pointer-events-none');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
